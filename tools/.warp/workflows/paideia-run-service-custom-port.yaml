name: paideia-poc-microservices-spring · Run service custom port (PowerShell)
command: .\tools\scripts\local\run-service.ps1 -Service {{service}} -Port {{port}} -SkipInfra
tags: ["paideia", "local", "service", "powershell"]
description: Ejecuta un microservicio con puerto personalizado sin relanzar infraestructura.
arguments:
  - name: service
    description: Nombre del servicio
    default_value: course-service
  - name: port
    description: Puerto local para el servicio
    default_value: "18081"
