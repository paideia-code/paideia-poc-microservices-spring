spring:
  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://localhost:15432/users}
    username: ${USER_DB_USER:users}
    password: ${USER_DB_PASSWORD:users_pass}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: never

server:
  port: ${USER_SERVICE_PORT:8084}