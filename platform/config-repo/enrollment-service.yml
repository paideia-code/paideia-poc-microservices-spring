spring:
  datasource:
    url: ${ENROLLMENT_DB_URL:jdbc:postgresql://localhost:15432/enrollment}
    username: ${ENROLLMENT_DB_USER:enrollment}
    password: ${ENROLLMENT_DB_PASSWORD:enrollment_pass}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        "[spring.json.add.type.headers]": false

server:
  port: ${ENROLLMENT_SERVICE_PORT:8082}

clients:
  course-service:
    url: ${COURSE_SERVICE_URL:http://localhost:8081}
  payment-service:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8083}