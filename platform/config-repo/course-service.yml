spring:
  datasource:
    url: ${COURSE_DB_URL:jdbc:postgresql://localhost:15432/course}
    username: ${COURSE_DB_USER:course}
    password: ${COURSE_DB_PASSWORD:course_pass}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8081

logging:
  level:
    io.paideia: DEBUG