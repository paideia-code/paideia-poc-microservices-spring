spring:
  application:
    name: enrollment-service
  datasource:
    url: ${ENROLLMENT_DB_URL:jdbc:postgresql://localhost:15432/enrollment}
    username: ${ENROLLMENT_DB_USER:enrollment}
    password: ${ENROLLMENT_DB_PASSWORD:enrollment_pass}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: never

server:
  port: ${ENROLLMENT_SERVICE_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

clients:
  course-service:
    url: ${COURSE_SERVICE_URL:http://localhost:8081}
  payment-service:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8083}
  notification-service:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
