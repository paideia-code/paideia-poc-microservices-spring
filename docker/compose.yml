name: paideia-poc-microservices-spring

services:

  # ─── Capa 1: Persistencia ───
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - net

  mongo:
    image: mongo:8
    container_name: mongo
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - net

  # ─── Capa 2: Observabilidad
  otel-lgtm:
    image: grafana/otel-lgtm:0.33.0
    ports:
      - "3000:3000" # Grafana
      - "4317:4317"
      - "4318:4318" # OpenTelemetry - HTTP
      - "9090:9090" # Prometheus
    volumes:
      - ./prometheus/prometheus.yml:/otel-lgtm/prometheus.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/paideia:ro
      - ./grafana/dashboards-provisioning.yml:/otel-lgtm/grafana/conf/provisioning/dashboards/paideia.yaml:ro
      - otel_lgtm_data:/data
    networks:
      - net

  # ─── Capa 3: Seguridad ───
  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/paideia-realm.json:/opt/keycloak/data/import/paideia-realm.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8090}:8080"
    networks:
      - net

volumes:
  postgres_data:
  mongo_data:
  otel_lgtm_data:
  keycloak_data:

networks:
  net:
    driver: bridge
